<link rel="dns-prefetch" href="https://www.gstatic.com"/>

<title>ZenithCrypto — NFT Gallery</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#04060e;--s1:#080d18;--s2:#0c1220;--s3:#111929;--a:#4f8ef7;--gold:#e8b84b;--gold2:#ffd166;--green:#0ecb81;--red:#f6465d;--purple:#7c5df7;--t1:#eaecf0;--t2:#6c7a96;--t3:#2d3a55;--font:'Inter',sans-serif;--fhd:'Orbitron',monospace;--fmono:'JetBrains Mono',monospace}
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--t1);font-family:var(--font);margin:0}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:rgba(79,142,247,.3);border-radius:2px}

/* ANIMS */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(79,142,247,.3)}50%{box-shadow:0 0 40px rgba(79,142,247,.6),0 0 80px rgba(79,142,247,.15)}}
@keyframes rarityShine{0%{background-position:200% 50%}100%{background-position:-200% 50%}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:1000;height:54px;background:rgba(4,6,14,.97);border-bottom:1px solid rgba(79,142,247,.12);display:flex;align-items:center;padding:0 14px;gap:8px;backdrop-filter:blur(24px)}
.tb-brand{font-family:var(--fhd);font-size:.72rem;font-weight:900;background:linear-gradient(135deg,#fff,#a8c4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1.5px}
.tb-sp{flex:1}
.tb-xp-wrap{width:60px;height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
#xpf{height:100%;background:linear-gradient(90deg,var(--a),var(--purple));border-radius:3px;width:0%;transition:width .5s}
#hbal{font-family:var(--fmono);font-size:.9rem;font-weight:700;background:linear-gradient(135deg,#e8b84b,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hlv{background:linear-gradient(135deg,var(--a),var(--purple));color:#fff;font-family:var(--fhd);font-size:.4rem;font-weight:900;padding:3px 8px;border-radius:20px}

/* TICKER */
#ticker-wrap{position:sticky;top:54px;z-index:999;height:26px;background:rgba(4,6,14,.98);border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;display:flex;align-items:center}
#ticker{display:flex;gap:18px;animation:tkscroll 30s linear infinite;white-space:nowrap;padding-left:12px}
@keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{display:inline-flex;gap:4px;align-items:center;font-size:.5rem;padding:0 10px;border-right:1px solid rgba(255,255,255,.05)}
.ti-s{font-family:var(--fmono);color:var(--t2);font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}

/* PAGE HEADER */
.page-header{background:radial-gradient(ellipse 100% 60% at 50% -10%,rgba(124,93,247,.18),transparent 60%),var(--s1);padding:16px;border-bottom:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
.page-header::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%237c5df7' fill-opacity='0.03'%3E%3Cpath d='M20 20l-5-8.66h10z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.ph-title{font-family:var(--fhd);font-size:.8rem;font-weight:900;background:linear-gradient(135deg,#fff,#c8d8ff,#7c5df7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;margin-bottom:4px}
.ph-sub{font-family:var(--fhd);font-size:.38rem;color:var(--t3);letter-spacing:1px}
.ph-stats{display:flex;gap:16px;margin-top:10px}
.ph-stat{text-align:center}
.ph-stat-v{font-family:var(--fmono);font-size:.7rem;font-weight:700;color:var(--t1)}
.ph-stat-l{font-family:var(--fhd);font-size:.32rem;color:var(--t3);letter-spacing:.5px;margin-top:2px}

/* TABS */
.nft-tabs{position:sticky;top:80px;z-index:990;display:flex;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.05)}
.nft-tab{flex:1;padding:11px 4px;text-align:center;font-family:var(--fhd);font-size:.44rem;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;letter-spacing:.5px}
.nft-tab.active{color:var(--purple);border-bottom-color:var(--purple)}

/* FILTER */
.filter-row{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.04)}
.filter-row::-webkit-scrollbar{display:none}
.fp{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--t2);font-family:var(--fhd);font-size:.38rem;cursor:pointer;transition:.12s}
.fp.on{border-color:var(--purple);background:rgba(124,93,247,.15);color:var(--purple)}

/* NFT GRID */
.nft-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}

/* NFT CARD */
.nft-card{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .2s;animation:fadeUp .3s ease both;position:relative}
.nft-card:active{transform:scale(.96)}
.nft-card.owned{border-color:rgba(124,93,247,.4);box-shadow:0 0 20px rgba(124,93,247,.15)}
.nft-card.locked{opacity:.55}
.nft-card.locked .nft-art{filter:grayscale(.8)}

/* Rarity borders */
.nft-card.common{border-color:rgba(108,122,150,.3)}
.nft-card.uncommon{border-color:rgba(0,230,118,.3);box-shadow:0 0 12px rgba(0,230,118,.06)}
.nft-card.rare{border-color:rgba(0,212,255,.3);box-shadow:0 0 12px rgba(0,212,255,.08)}
.nft-card.epic{border-color:rgba(196,113,245,.4);box-shadow:0 0 16px rgba(196,113,245,.12)}
.nft-card.legendary{border-color:rgba(240,185,11,.4);box-shadow:0 0 20px rgba(240,185,11,.15)}
.nft-card.mythic{border-color:rgba(255,71,87,.5);box-shadow:0 0 24px rgba(255,71,87,.2);animation:glowPulse 2s infinite}

/* ART */
.nft-art{height:130px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.nft-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));pointer-events:none}
.nft-art .rarity-label{position:absolute;top:8px;right:8px;font-family:var(--fhd);font-size:.34rem;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:.5px;z-index:2}
.nft-art .lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,14,.75);z-index:3;gap:4px}
.lock-ico{font-size:1.6rem}
.lock-lbl{font-family:var(--fhd);font-size:.38rem;color:var(--gold);letter-spacing:1px}
.nft-emoji{z-index:1;animation:float 3s ease-in-out infinite;display:block}

/* NFT INFO */
.nft-info{padding:10px}
.nft-name{font-family:var(--fhd);font-size:.56rem;font-weight:700;color:var(--t1);margin-bottom:3px}
.nft-rarity{font-family:var(--fhd);font-size:.36rem;font-weight:700;margin-bottom:5px}
.nft-price-row{display:flex;align-items:center;justify-content:space-between}
.nft-price{font-family:var(--fmono);font-size:.6rem;font-weight:700;color:var(--gold)}
.nft-owned-badge{font-family:var(--fhd);font-size:.34rem;background:rgba(124,93,247,.15);color:var(--purple);border:1px solid rgba(124,93,247,.3);padding:2px 7px;border-radius:12px}
.nft-bonus{font-family:var(--fhd);font-size:.34rem;color:var(--t3);margin-top:4px;line-height:1.5}

/* BUY BUTTON */
.nft-buy-btn{width:100%;margin-top:8px;padding:9px;border-radius:9px;border:none;cursor:pointer;font-family:var(--fhd);font-size:.48rem;font-weight:700;letter-spacing:.5px;transition:.15s}
.nft-buy-btn.can{background:linear-gradient(135deg,var(--purple),var(--a));color:#fff;box-shadow:0 3px 14px rgba(124,93,247,.4)}
.nft-buy-btn.owned{background:rgba(14,203,129,.12);color:var(--green);border:1px solid rgba(14,203,129,.3)}
.nft-buy-btn.locked-btn{background:rgba(255,255,255,.05);color:var(--t3)}
.nft-buy-btn.cant{background:rgba(255,255,255,.05);color:var(--t3)}
.nft-buy-btn:active{transform:scale(.96)}

/* DETAIL MODAL */
.nft-modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.nft-modal.open{display:flex;animation:fadeUp .2s ease}
.nft-modal-box{width:100%;max-width:480px;background:var(--s1);border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.1);padding:20px;max-height:85vh;overflow-y:auto}
.modal-handle{width:40px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 16px}
.modal-art{height:180px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:14px;position:relative;overflow:hidden}
.modal-art::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);pointer-events:none}
.modal-title{font-family:var(--fhd);font-size:.8rem;font-weight:900;color:var(--t1);margin-bottom:4px}
.modal-rarity{font-family:var(--fhd);font-size:.44rem;margin-bottom:12px}
.modal-desc{font-size:.62rem;color:var(--t2);line-height:1.7;margin-bottom:14px}
.modal-perks{background:var(--s2);border-radius:10px;padding:12px;margin-bottom:14px}
.modal-perk-title{font-family:var(--fhd);font-size:.44rem;color:var(--t2);letter-spacing:1px;margin-bottom:8px}
.perk-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.58rem}
.perk-icon{font-size:.8rem;flex-shrink:0}
.modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.modal-stat{background:var(--s2);border-radius:8px;padding:9px 10px;text-align:center}
.modal-stat-l{font-family:var(--fhd);font-size:.34rem;color:var(--t3);margin-bottom:3px}
.modal-stat-v{font-family:var(--fmono);font-size:.58rem;font-weight:700}
.modal-buy-btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:var(--fhd);font-size:.64rem;font-weight:900;letter-spacing:1.5px;transition:.15s;position:relative;overflow:hidden}
.modal-buy-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);pointer-events:none;border-radius:inherit}
.modal-buy-btn:active{transform:scale(.97)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--t2);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* MY NFTS */
.my-nft-empty{text-align:center;padding:50px 16px}
.my-nft-empty-icon{font-size:3rem;margin-bottom:12px;animation:float 3s infinite}

/* TOAST */
#toast{display:none;position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--s1);border-radius:10px;padding:10px 16px;align-items:center;gap:8px;box-shadow:0 6px 28px rgba(0,0,0,.65);border-left:3px solid var(--a);max-width:92vw}
#toast-msg{font-family:var(--fhd);font-size:.6rem;font-weight:700}
</style>
</head>
<body>

<div id="topbar">
  <div onclick="ZCS.go('home')" style="cursor:pointer;display:flex;align-items:center;gap:8px">
    <svg width="30" height="30" viewBox="0 0 140 140" fill="none"><defs><linearGradient id="tbg" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#5b9bff"/><stop offset="50%" stop-color="#9b6dff"/><stop offset="100%" stop-color="#f5c842"/></linearGradient></defs><polygon points="70,8 118,35 118,105 70,132 22,105 22,35" fill="rgba(91,155,255,0.1)" stroke="url(#tbg)" stroke-width="2"/><path d="M40,43 L100,43 L100,55 L64,85 L100,85 L100,97 L40,97 L40,85 L76,55 L40,55 Z" fill="url(#tbg)"/></svg>
    <span class="tb-brand">‹ NFT</span>

</div>

<div id="ticker-wrap"><div id="ticker">

</div></div>

<!-- PAGE HEADER -->
<div class="page-header">

  </div>
</div>

<!-- TABS -->
<div class="nft-tabs">
  <div class="nft-tab active" id="ntab-market" onclick="nftTab('market')">🛒 MARKET</div>
  <div class="nft-tab" id="ntab-my" onclick="nftTab('my')">💎 MY NFTS</div>
</div>

<!-- FILTERS -->
<div class="filter-row" id="nft-filters">
  <div class="fp on" onclick="nftFilter('ALL')">ALL</div>

<!-- CONTENT -->

<!-- DETAIL MODAL -->

<script>
/* ═══════════════════════════════════════════
   GLOBALS
═══════════════════════════════════════════ */
var G={},db=null,auth=null,rtdb=null,FS=null;

/* ═══════════════════════════════════════════════════════
   ZENITHCRYPTO SECURITY MODULE v1.0
   - Input sanitization
   - Rate limiting
   - Anti-cheat detection
   - Player ban checking
   - Transaction validation
   - XSS prevention
═══════════════════════════════════════════════════════ */
var _SECURITY={
  ADMIN_UID:'Bj3hFdqE3xhvtWE7gI0a70KQCze2',
  _rl:{},
  _violations:0,
  _maxBalance:1000000,
  _maxTrade:10000,
  
  /* Rate limiter - returns false if rate exceeded */
  rateLimit:function(key,maxPerMin){
    var now=Date.now();
    if(!this._rl[key])this._rl[key]=[];
    this._rl[key]=this._rl[key].filter(function(t){return now-t<60000;});
    if(this._rl[key].length>=maxPerMin){
      _SECURITY.violation('Rate limit exceeded: '+key);
      return false;
    }
    this._rl[key].push(now);
    return true;
  },
  
  /* Input sanitizer */
  sanitize:function(str,maxLen){
    if(typeof str!=='string')return '';
    return str.replace(/[<>\"'`\\\\]/g,'').replace(/javascript:/gi,'').replace(/on\w+=/gi,'').slice(0,maxLen||200).trim();
  },
  
  /* Number validator */
  safeNum:function(n,min,max){
    var v=parseFloat(n);
    if(isNaN(v)||!isFinite(v))return 0;
    if(min!==undefined)v=Math.max(min,v);
    if(max!==undefined)v=Math.min(max,v);
    return v;
  },
  
  /* Balance anti-cheat */
  validateBalance:function(amount,type){
    if(!G.uid||G.isGuest)return true;
    var bal=parseFloat(G.bal)||0;
    // Detect impossible balance
    if(bal>this._maxBalance){
      this.violation('Impossible balance: $'+bal);
      return false;
    }
    if(amount>this._maxTrade){
      this.violation('Single trade exceeds max: $'+amount);
      return false;
    }
    if(amount>(bal+0.001)){
      if(window.toast)toast('Insufficient balance','error');
      return false;
    }
    return true;
  },
  
  /* Log security violation */
  violation:function(msg){
    this._violations++;
    console.warn('[SECURITY] '+msg);
    if(this._violations>=5){
      this.banCheck();
    }
    if(db&&G.uid){
      db.collection('securityLogs').add({uid:G.uid,msg:msg,ts:Date.now(),ip:'hidden'}).catch(function(){});
    }
  },
  
  /* Check if player is banned */
  checkBan:function(uid){
    if(!db||!uid)return;
    db.collection('bans').doc(uid).get().then(function(snap){
      if(snap.exists){
        var ban=snap.data();
        var expired=ban.expiry&&Date.now()>ban.expiry;
        if(!expired){
          // Player is banned
          document.body.innerHTML='<div style="position:fixed;inset:0;background:#04060e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center">'
            +'<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#f6465d" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>'
            +'<div style="font-family:Orbitron,monospace;font-size:1.2rem;font-weight:900;color:#f6465d">ACCOUNT BANNED</div>'
            +'<div style="font-family:Orbitron,monospace;font-size:.52rem;color:#6c7a96;line-height:1.7;max-width:320px">'
            +'Reason: '+(ban.reason||'Violation of terms')+'<br>'
            +(ban.expiry?'Until: '+new Date(ban.expiry).toLocaleDateString():'PERMANENT')
            +'</div>'
            +'<div style="font-family:Orbitron,monospace;font-size:.44rem;color:#2d3a55">Appeal: support@zenithcrypto.app</div>'
            +'</div>';
          throw new Error('BANNED');
        }
      }
    }).catch(function(e){if(e.message!=='BANNED')console.log('ban check ok');});
  },
  
  banCheck:function(){this.checkBan(G.uid);},
  
  /* Validate trade amount */
  validateTrade:function(amount,sym){
    amount=this.safeNum(amount,0.01,this._maxTrade);
    if(!amount)return 0;
    if(!this.rateLimit('trade',50)){toast('Too many trades! Slow down.','error');return 0;}
    if(!this.validateBalance(amount,'trade'))return 0;
    return amount;
  },
  
  /* Validate send */
  validateSend:function(amount,toUid){
    if(!toUid||toUid===G.uid){toast('Invalid recipient','error');return false;}
    if(!this.rateLimit('send',5)){toast('Too many sends! Wait 1 minute.','error');return false;}
    if(!this.validateBalance(amount,'send'))return false;
    return true;
  },
  
  /* Prevent XSS in user content */
  renderSafe:function(html){
    return html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  },

/* BUY NFT */
function buyNFT(id){
  if(!G.uid){toast('Please log in first','error');return;}
  var n=NFT_CATALOG.find(function(x){return x.id===id;});if(!n)return;
  var owned=G.ownedNFTs||[];
  if(owned.includes(id)){toast('You already own this NFT!','error');return;}
  var lv=G.level||1;
  if(lv<n.lvlReq){toast('Reach LV'+n.lvlReq+' to unlock!','error');return;}
  var bal=parseFloat(G.bal)||0;
  if(bal<n.price){toast('Need $'+n.price.toFixed(2)+'. You have $'+bal.toFixed(2),'error');return;}
  G.bal=bal-n.price;
  G.ownedNFTs=owned.concat([id]);
  // Apply perks
  if(n.bonus.badge)G.nftBadge=n.bonus.badge;
  if(n.bonus.mineSpeed)G.nftMineBonus=(G.nftMineBonus||0)+n.bonus.mineSpeed;
  if(n.bonus.allBonus)G.nftAllBonus=(G.nftAllBonus||0)+n.bonus.allBonus;
  if(n.bonus.tradeBonus)G.nftTradeBonus=(G.nftTradeBonus||0)+n.bonus.tradeBonus;
  if(n.bonus.freeSpins)G.spins=(G.spins||0)+n.bonus.freeSpins;
  save({bal:G.bal,ownedNFTs:G.ownedNFTs,nftBadge:G.nftBadge||'',nftMineBonus:G.nftMineBonus||0,nftAllBonus:G.nftAllBonus||0,nftTradeBonus:G.nftTradeBonus||0,spins:G.spins||0});
  // Log to Firebase
  if(db)db.collection('nft_purchases').add({uid:G.uid,nftId:id,price:n.price,rarity:n.rarity,ts:FS?FS.FieldValue.serverTimestamp():new Date()}).catch(function(){});
  toast('🎉 '+n.name+' purchased! Perks activated.','success');
  updateHdr();updatePageStats();
  gid('nft-modal').classList.remove('open');
  if(_nftTab==='market')renderMarket();else renderMyNFTs();
}

    auth.onAuthStateChanged(function(user){
      if(_done)return;_done=true;
      if(user){G.uid=user.uid;db.collection('players').doc(user.uid).get().then(function(snap){if(snap.exists)Object.assign(G,snap.data());boot();}).catch(function(e){window._showOffline&&window._showOffline("Could not reach server.");});}
      else{if(G.uid){db.collection('players').doc(G.uid).get().then(function(snap){if(snap.exists)Object.assign(G,snap.data());boot();}).catch(function(e){window._showOffline&&window._showOffline("Could not reach server.");});}else boot();}
    });
    setTimeout(function(){if(!_done){_done=true;boot();}},6000);
  }catch(e){setTimeout(_initFB,100);}
}
function boot(){
  try{_SECURITY.init(G.uid);}catch(e){}
  updateHdr();updatePageStats();startPrices();
  renderMarket();
}
_initFB();


/* ═══════════════ SECURITY MODULE ═══════════════ */
var _SEC={
  MAX_BALANCE:999999,
  MAX_LEVEL:30,
  MAX_XP:200000,
  RATE_LIMITS:{},
  
  // Rate limiting
  rateLimit:function(key,maxPerMin){
    var now=Date.now();
    if(!_SEC.RATE_LIMITS[key])_SEC.RATE_LIMITS[key]=[];
    _SEC.RATE_LIMITS[key]=_SEC.RATE_LIMITS[key].filter(function(t){return now-t<60000;});
    if(_SEC.RATE_LIMITS[key].length>=maxPerMin)return false;
    _SEC.RATE_LIMITS[key].push(now);return true;
  },
  
  // Validate number fields
  sanitizeNum:function(n,min,max){n=parseFloat(n)||0;return Math.max(min||0,Math.min(max||_SEC.MAX_BALANCE,n));},
  
  // Sanitize string input
  sanitizeStr:function(s,maxLen){return String(s||'').replace(/[<>"'`]/g,'').slice(0,maxLen||200).trim();},
  
  // Validate trade amount
  validateTrade:function(amt,bal){
    if(!_SEC.rateLimit('trade',300))return 'Rate limit: max 300 trades/min';
    if(isNaN(amt)||amt<=0)return 'Invalid amount';
    if(amt>bal)return 'Insufficient balance';
    if(amt>10000)return 'Max trade: $10,000 per transaction';
    return null;
  },
  
  // Check if UID is banned
  checkBan:function(uid,cb){
    if(!db||!uid)return;
    db.collection('players').doc(uid).get().then(function(snap){
      if(snap.exists&&snap.data().banned){
        var reason=snap.data().banReason||'Policy violation';
        document.body.innerHTML='<div style="position:fixed;inset:0;background:#04060e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center"><svg width="60" height="60" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" stroke="#f6465d" stroke-width="4"/><line x1="25" y1="25" x2="75" y2="75" stroke="#f6465d" stroke-width="4"/><line x1="75" y1="25" x2="25" y2="75" stroke="#f6465d" stroke-width="4"/></svg><div style="font-family:Orbitron,monospace;font-size:1rem;font-weight:900;color:#f6465d">ACCOUNT BANNED</div><div style="font-family:Orbitron,monospace;font-size:.54rem;color:#6c7a96;max-width:300px;line-height:1.7">Reason: '+esc(reason||'Unknown')+'<br>Contact support if you believe this is an error.</div></div>';
        if(typeof auth!=="undefined"&&auth)auth.signOut().catch(function(){});
      } else if(cb) cb();
    }).catch(function(){if(cb)cb();});
  },
  
  // Admin ban function
  banPlayer:function(uid,reason){
    if(!isAdmin()||!db)return;
    db.collection('players').doc(uid).update({banned:true,banReason:reason||'Policy violation',bannedAt:FS?FS.FieldValue.serverTimestamp():new Date()}).then(function(){toast('Player banned','success');}).catch(function(e){toast('Error: '+e.message,'error');});
  },
  
  // Validate UID format
  validUID:function(uid){return typeof uid==='string'&&uid.length>10&&uid.length<128;},
  
  // Anti-cheat: verify balance hasn't been tampered
  verifyBalance:function(){
    if(!G.uid||!db)return;
    db.collection('players').doc(G.uid).get().then(function(snap){
      if(!snap.exists)return;
      var serverBal=snap.data().bal||0;
      var localBal=G.bal||0;
      // If local is MORE than server by >100, suspect tampering
      if(localBal-serverBal>100){
        console.warn('Balance mismatch detected');
        G.bal=serverBal;
        if(typeof updateHdr==='function')updateHdr();
      }
    }).catch(function(){});
  }
};

// Run ban check after login
function runSecurityChecks(){
  if(G.uid&&!G.isGuest){
    _SEC.checkBan(G.uid, function(){
      // Only runs if not banned
      setTimeout(function(){_SEC.verifyBalance();},5000);
    });
  }
}

(function(){var _ot=null;window._showOffline=function(m){if(document.getElementById('_zco'))return;var d=document.createElement('div');d.id='_zco';d.style.cssText='position:fixed;inset:0;z-index:99999;background:#04060e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;font-family:Orbitron,monospace';d.innerHTML='<div style="font-size:3rem">&#128225;</div><div style="font-size:.9rem;font-weight:900;color:#eaecf0;letter-spacing:2px">CONNECTION LOST</div><div style="font-size:.5rem;color:#6c7a96;line-height:2;max-width:260px">'+(m||'No internet')+'<br><span id="_zco_cd">Retrying in 5s...</span></div><button onclick="window._retryNow&&window._retryNow()" style="padding:11px 26px;border-radius:10px;border:1.5px solid rgba(79,142,247,.4);background:rgba(79,142,247,.1);color:#4f8ef7;font-size:.52rem;cursor:pointer;font-weight:700;font-family:Orbitron,monospace">RETRY NOW</button>';document.body.appendChild(d);var c=5;_ot=setInterval(function(){c--;var r=document.getElementById('_zco_cd');if(r)r.textContent=c>0?'Retrying in '+c+'s...':'Retrying...';if(c<=0){clearInterval(_ot);window._retryNow&&window._retryNow();}},1000);};window._hideOffline=function(){var d=document.getElementById('_zco');if(d)d.remove();if(_ot)clearInterval(_ot);};window.addEventListener('online',function(){window._hideOffline();});window.addEventListener('offline',function(){window._showOffline('Internet lost.');});window.addEventListener('error',function(e){e.preventDefault();return true;},true);window.addEventListener('unhandledrejection',function(e){e.preventDefault();});})();
